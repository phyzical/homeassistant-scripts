blueprint:
  name: Button Toggle
  domain: automation
  input:
    button_device_id:
      name: Button
      selector:
        device:
          filter:
            - integration: mqtt
              model: Smart button
            - integration: mqtt
              model: Wireless switch with 1 button
    switch_entity_ids:
      name: Switch
      selector:
        entity:
          filter:
            - domain: switch
          multiple: true
    trigger:
      name: Trigger
      selector:
        select:
          mode: dropdown 
          options:
            - "single"
            - "hold"
            - "double"
            - "1_single"
            - "1_hold"
            - "1_double"
            - "2_single"
            - "2_hold"
            - "2_double"
            - "3_single"
            - "3_hold"
            - "3_double"
            - "4_single"
            - "4_hold"
            - "4_double" 
triggers:
  - domain: mqtt
    device_id: !input button_device_id
    type: action
    id: action
    subtype: !input trigger
    trigger: device
actions:
  - repeat:
      for_each: !input switch_entity_ids
      sequence:
        - variables:
            switch_entity: "{{ repeat.item }}"
            trigger_id: "{{ trigger.id }}"
            button: "{{ trigger_id == 'action' }}"
        - if:
            - condition: template
              value_template: "{{ button }}"
          then:
            - service: switch.toggle
              target:
                entity_id: "{{ switch_entity }}"
              data: {}
mode: single
